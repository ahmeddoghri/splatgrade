[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatgrade"
version = "0.1.0"
description = "3D Gaussian Splat artifact quality gate"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmed Doghri"}]
dependencies = []

[project.scripts]
splatgrade = "splatgrade.cli:main"

[tool.setuptools]
packages = ["splatgrade"]

[tool.setuptools.package-data]
splatgrade = ["web/*.html"]
